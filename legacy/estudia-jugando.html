<style>

body{min-height:100vh}
button{font-family:inherit;cursor:pointer}

.oculto{display:none!important}

.nodo-w{position:relative}
.nodo{width:72px;height:66px;border-radius:50%;border:0;font-size:28px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;
background:var(--nar);box-shadow:0 7px 0 var(--nar2);transition:transform .08s}

.nodo.hecho{background:#facc15;box-shadow:0 7px 0 #ca8a04}

.globo:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--borde);border-bottom:0}
@keyframes flota{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.estrellas{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:-1px}
.mascota{font-size:44px;margin:6px 0 0;text-align:center}

.lec-cuerpo{flex:1;overflow-y:auto;padding:6px 18px 18px}
.tipo{font-size:12px;font-weight:900;letter-spacing:1.6px;color:var(--sub);margin:6px 0 6px;text-transform:uppercase}

.ops{display:flex;flex-direction:column;gap:10px}
.op{border:2px solid var(--borde);border-bottom-width:4px;border-radius:14px;background:#fff;padding:14px;font-size:16px;font-weight:600;text-align:left;color:var(--txt);

.op .l{width:28px;height:28px;flex:0 0 28px;border:2px solid var(--borde);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--sub)}

.fin h2{font-size:26px;color:#ca8a04;margin:6px 0 4px;font-weight:900}

.pag h2{font-size:24px;color:var(--neg);margin:6px 0 4px;font-weight:900}
.pag > p{color:var(--sub);margin:0 0 16px;font-size:14.5px;line-height:1.45}
.paso{border:2px solid var(--borde);border-radius:16px;padding:14px;margin-bottom:12px}

.paso h4{display:flex;align-items:center;margin:0 0 6px;font-size:16px;color:var(--neg)}

.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos .bt{font-size:14px;padding:12px 8px;text-transform:none;margin:0}
textarea{width:100%;min-height:150px;border:2px solid var(--borde);border-radius:14px;padding:12px;font:13px ui-monospace,Menlo,Consolas,monospace;resize:vertical;outline:none}
textarea:focus{border-color:var(--nar)}
.aviso{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin:10px 0}
.aviso.mal{background:var(--malc);color:#991b1b}.aviso.bien{background:var(--okc);color:#166534}.aviso.info{background:var(--narc);color:#9a3412}
.curso{border:2px solid var(--borde);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}

.curso .t{flex:1;min-width:0}

.barrita{height:8px;background:var(--gris);border-radius:9px;margin-top:6px;overflow:hidden}.barrita i{display:block;height:100%;background:var(--nar)}
.mini{border:0;background:none;color:var(--sub);font-size:20px;padding:4px}
.vacio{text-align:center;color:var(--sub);padding:30px 10px}
.vacio .mascota{font-size:64px}
/* Menú de abajo */
.menu{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid var(--gris);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.menu div{display:flex;max-width:480px;width:100%}
.menu button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub)}
.menu button small{font-size:11px;font-weight:800}
.menu button.on{color:var(--nar)}
.menu button.on span{background:var(--narc);border:2px solid #fdba74;border-radius:12px;padding:0 10px}

box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90%;text-align:center}
.confeti{position:fixed;top:-20px;z-index:60;font-size:22px;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg)}}
.ajuste{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gris);padding:12px 0;font-weight:700}
.ajuste button{border:2px solid var(--borde);background:#fff;border-radius:10px;padding:6px 12px;font-weight:800}
</style>

        delete S.cursos[id]; if (S.actual === id) S.actual = Object.keys(S.cursos)[0] || null; guardar(); ir('cursos'); } }, ['🗑'])]));
  });
  pag.appendChild(el('button', { class: 'bt', onclick: function () { ir('nuevo'); } }, ['➕ Nuevo curso']));
  if (!ids.some(function (id) { return /ejemplo/i.test(S.cursos[id].datos.titulo); }))
    pag.appendChild(el('button', { class: 'bt blanco', onclick: function () { agregarCurso(limpiarCurso(EJEMPLO)); ir('camino'); } }, ['Probar con un ejemplo']));
  pag.appendChild(el('div', { class: 'ajuste' }, [el('span', { text: '🔊 Sonidos' }),
    el('button', { onclick: function () { S.sonido = !S.sonido; guardar(); ir('cursos'); } }, [S.sonido ? 'Activados' : 'Apagados'])]));
  app.appendChild(pag);
}

// ---------- Nuevo curso ----------
function verNuevo() {
  app.appendChild(barra());
  var area = el('textarea', { placeholder: 'Pega aquí todo lo que te respondió la IA…', 'aria-label': 'Respuesta de la IA' });
  var aviso = el('div');
  var pag = el('div', { class: 'pag' }, [
    el('h2', { text: '➕ Tu PDF en un juego' }),
    el('p', { text: 'En 3 pasos. Usa Gemini o ChatGPT gratis: los dos aceptan PDF.' }),
    el('div', { class: 'paso' }, [el('h4', null, [el('span', { class: 'n', text: '1' }), 'Copia el prompt']),
      el('p', { text: 'Es la instrucción que le dice a la IA cómo armar tu curso.' }),
      el('button', { class: 'bt negro', onclick: function () { copiar(PROMPT, '📋 Prompt copiado. Ahora ábrelo en la IA.'); } }, ['📋 Copiar el prompt'])]),
    el('div', { class: 'paso' }, [el('h4', null, [el('span', { class: 'n', text: '2' }), 'Pásale tu PDF a la IA']),
      el('p', { text: 'Toca ＋ o 📎, sube tu PDF, pega el prompt y envía. Espera a que termine de escribir.' }),
      el('div', { class: 'dos' }, [
        el('a', { class: 'bt blanco', href: 'https://gemini.google.com/app', target: '_blank', rel: 'noopener', style: 'text-decoration:none;text-align:center' }, ['✨ Gemini']),
        el('a', { class: 'bt blanco', href: 'https://chatgpt.com/', target: '_blank', rel: 'noopener', style: 'text-decoration:none;text-align:center' }, ['🤖 ChatGPT'])])]),
    el('div', { class: 'paso' }, [el('h4', null, [el('span', { class: 'n', text: '3' }), 'Pega su respuesta aquí']),
      el('p', { text: 'En la IA toca «Copiar» (o mantén presionado y copia todo). Si tu PDF es largo, escríbele «sigue» y pega también la nueva respuesta: se suma al mismo curso.' }),
      area, aviso,
      el('button', { class: 'bt', style: 'margin-top:12px', onclick: function () {
        aviso.innerHTML = '';
        try {
          var r = leerCurso(area.value), c = limpiarCurso(r.datos), res = agregarCurso(c);
          var nEj = c.unidades.reduce(function (a, u) { return a + u.lecciones.reduce(function (b, l) { return b + l.ejercicios.length; }, 0); }, 0);
          toast(res.existia ? '✅ Se agregaron ' + res.agregadas + ' unidades a «' + c.titulo + '»' : '✅ ¡Listo! ' + c.unidades.length + ' unidades y ' + nEj + ' ejercicios', 3500);
          if (r.cortado) setTimeout(function () { toast('La respuesta vino cortada: armé lo que llegó completo. Escríbele «sigue» a la IA para el resto.', 5000); }, 3600);
          ir('camino');
        } catch (e) { aviso.appendChild(el('div', { class: 'aviso mal', text: e.message })); }
      } }, ['🎮 Crear mi juego'])])
  ]);
  app.appendChild(pag);
}
function copiar(t, ok) {
  var hecho = function () { toast(ok); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(hecho, function () { copiarViejo(t); hecho(); }); }
  else { copiarViejo(t); hecho(); }
}
function copiarViejo(t) {
  var a = el('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a);
  a.focus(); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove();
}

// ---------- Navegación ----------
function ir(p) {
  pantalla = p; app.innerHTML = '';
  ({ camino: verCamino, practicar: verPracticar, cursos: verCursos, nuevo: verNuevo })[p]();
  document.querySelectorAll('#menu button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-ir') === p); });
  ponerMarca();
  window.scrollTo(0, 0);
}
document.querySelectorAll('#menu button').forEach(function (b) { b.addEventListener('click', function () { ir(b.getAttribute('data-ir')); }); });

// La marca del kit va siempre al pie y vuelve sola si alguien la quita.
function ponerMarca() {
  if (!document.querySelector('#app > .mk-pie')) app.appendChild(el('div', { class: 'mk-pie', text: marca() }));
  var m = document.querySelector('#app > .mk-pie'); if (m.textContent !== marca()) m.textContent = marca();
  m.style.cssText = 'display:block!important;visibility:visible!important;opacity:1!important';
}
new MutationObserver(function () { if (!document.querySelector('#app > .mk-pie') || document.querySelector('#app > .mk-pie').textContent !== marca()) ponerMarca(); })
  .observe(app, { childList: true, subtree: true, characterData: true });
setInterval(ponerMarca, 4000);

window.estudiaJugando = { leerCurso: leerCurso, limpiarCurso: limpiarCurso, estado: function () { return S; } };
ir('camino');
})();
</script>
